<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>

        <header class="app-header">
            <div>
                <p class="app-title">LeadMemo</p>
                <p class="app-tagline">Remember your leads.</p>
            </div>
            <img class="app-logo" src="icon.png" alt="LeadMemo logo">
        </header>
        <input type="text" id="input-el" placeholder="Paste a link (e.g. linkedin.com/in/name)">
        <textarea id="note-el" placeholder="Note: why are you saving this? (max 50 words)"></textarea>
        <p id="word-count">0 / 50 words</p>

        <label for="tag-el">What is this link for?</label>
        <select id="tag-el">
            <option value="Client">Client (contact)</option>
            <option value="Job">Job (contact)</option>
            <option value="Research">Research</option>
            <option value="Other">Other</option>
        </select>
        <input type="text" id="custom-tag-el" class="hidden" placeholder="Type your own tag (e.g. Movies, Supplier)" maxlength="20">

        <button id="input-btn">SAVE INPUT</button>
        <button id="tab-btn">SAVE TAB</button>
        <button id="delete-btn">DELETE ALL</button>
        <div id="top-three"></div>
        <ul id="ul-el">
        </ul>
        <script src="index.js"></script>
    </body>
</html>
