<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>

        <header class="app-header">
            <div>
                <p class="app-title">LeadMemo</p>
                <p class="app-tagline">Remember your leads.</p>
            </div>
            <img class="app-logo" src="icon.png" alt="LeadMemo logo">
            <p class="legend">
                <span><i class="d g"></i>0-2 days</span>
                <span><i class="d y"></i>3-6 days</span>
                <span><i class="d r"></i>7+ days</span>
            </p>
        </header>

        <main>
            <section class="capture">
                <input type="text" id="input-el" placeholder="Paste a link (e.g. linkedin.com/in/name)">

                <div class="note-wrap">
                    <textarea id="note-el" placeholder="Note: why are you saving this? (max 50 words)"></textarea>
                    <p id="word-count">0 / 50 words</p>
                </div>

                <label for="tag-el">What is this link for?</label>
                <select id="tag-el">
                    <option value="Client">Client (contact)</option>
                    <option value="Job">Job (contact)</option>
                    <option value="Research">Research</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" id="custom-tag-el" class="hidden" placeholder="Type your own tag (e.g. Movies, Supplier)" maxlength="20">
                <div id="tag-suggest" class="suggest hidden"></div>

                <div class="save-row">
                    <button id="input-btn">Save input</button>
                    <button id="tab-btn">Save tab</button>
                </div>
            </section>

            <section class="options">
                <label class="switch" title="Get a notification when a lead turns yellow or red">
                    <input type="checkbox" id="notif-toggle"> Notifications
                </label>
                <label class="switch" title="Remind me once a day about leads that are still red">
                    <input type="checkbox" id="daily-toggle"> Daily reminder
                </label>
                <label class="switch" title="Keep your leads in sync on every device where you use Chrome with the same Google account">
                    <input type="checkbox" id="sync-toggle"> Sync
                </label>
                <button id="delete-btn" title="Double-click to delete every lead">Delete all</button>
                <p id="sync-status" class="sync-status"></p>
            </section>

            <div id="top-three" class="hidden"></div>
            <section class="search">
                <input type="text" id="search-el" placeholder="Search leads (name, note, tag...)">
                <select id="filter-el"></select>
            </section>
            <ul id="ul-el"></ul>
        </main>

        <script src="index.js"></script>
    </body>
</html>
